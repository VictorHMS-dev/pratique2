<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Calculadora EBAC</h1>
        <h2>Contas</h2>
        <form id="form-contas">
            <input type="number" id="numero-1" required placeholder="Primeiro número" />
            <P class="error-message">
                O primeiro numero tem que ser menor que o segundo
            </P>
            <input type="number" id="numero-2" required placeholder="Segundo número" />
            <button id="btn-depositar" type="submit">Prova Real</button>
        </form>
        <p class="success-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
